<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ioana's Blog</title> 
  {% load static %}

<link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
<link rel="stylesheet" href="{% static 'css/Menu.css' %}">
</head>
<body>
<div class="sidebar">
<div class="top"></div>
<div class="logo">
    <i class="bx bxl-codepen"></i>
    <span>Ioana's Blog</span>
</div>
    <i class="bx bx-menu" id="btn"></i>
<div class="user">
    <img src="{% static 'images/images/WhatsApp Image 2025-03-02 at 23.11.26.jpeg ' %}" alt="me" class="user-img">
    <div>
        <p class="bold"> Hanas Ioana</p>
        <p>Admin</p>
    </div>
</div>
<ul>
    <li>
        <a href="{% url 'chatbot' %}">
            <i class="bx bxs-grid-alt"></i>
            <span class="nav-item">Chatbot</span>
        </a>
        <span class="tooltip">Chatbot</span>
    </li>
    <li>
        <a href="{% url 'home' %}">
            <i class='bx bxs-home-alt-2'></i>
            <span class="nav-item">Home</span>
        </a>
        <span class="tooltip">Home</span>
    </li>
    <li>
        <a href="{% url 'about' %}">
            <i class='bx bxl-instagram-alt'></i>
            <span class="nav-item">About</span>
        </a>
        <span class="tooltip">About</span>
    </li>
    <li>
        <a href="{% url 'gallery' %}">
            <i class='bx bxs-photo-album' ></i>
            <span class="nav-item">Gallery</span>
        </a>
        <span class="tooltip">Gallery</span>
    </li>
    <li>
        <a href="{% url 'form' %}">
            <i class='bx bx-pencil'></i>
            <span class="nav-item">Form</span>
        </a>
        <span class="tooltip">Form</span>
    </li>
    <li>
        <a href="#">
            <i class="bx bx-cog"></i>
            <span class="nav-item">Settings</span>
        </a>
        <span class="tooltip">Settings</span>
    </li>
    <li>
        <a href="#">
            <i class="bx bx-log-out"></i>
            <span class="nav-item">Logout</span>
        </a>
        <span class="tooltip">Logout</span>
    </li>
</ul>
</div>
<div class="main-content">
    <div class="container">
        <h1>Ioana's Blog</h1>
    </div>
</div>
</body>
<script>
    let btn = document.querySelector('#btn')
    let sidebar= document.querySelector('.sidebar')

    btn.onclick = function(){
        sidebar.classList.toggle('active')
    };
</script>
</html>
