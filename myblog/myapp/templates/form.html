<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formular</title>
    {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <link rel="stylesheet" href="{% static 'css/Menu.css' %}"> <!-- Add the sidebar's stylesheet -->
  <script src="{% static 'js/formj.js' %}"></script>
</head>
<body>

  <!-- Sidebar Menu Start -->
  <div class="sidebar">
    <div class="top"></div>
    <div class="logo">
      <i class="bx bxl-codepen"></i>
      <span>Ioana's Blog</span>
    </div>
    <i class="bx bx-menu" id="btn"></i>

    <div class="user">
      <img src="{% static 'images/WhatsApp Image 2025-03-02 at 23.11.26.jpeg' %}" alt="me" class="user-img">
      <div>
        <p class="bold">Hanas Ioana</p>
        <p>Admin</p>
      </div>
    </div>

    <ul>
      <li>
        <a href="{% url 'chatbot' %}">
          <i class="bx bxs-grid-alt"></i>
          <span class="nav-item">Chatbot</span>
        </a>
        <span class="tooltip">Chatbot</span>
      </li>
      <li>
        <a href="{% url 'home' %}">
          <i class='bx bxs-home-alt-2'></i>
          <span class="nav-item">Home</span>
        </a>
        <span class="tooltip">Home</span>
      </li>
      <li>
        <a href="{% url 'about' %}">
          <i class='bx bxl-instagram-alt'></i>
          <span class="nav-item">About</span>
        </a>
        <span class="tooltip">About</span>
      </li>
      <li>
        <a href="{% url 'gallery' %}">
          <i class='bx bxs-photo-album'></i>
          <span class="nav-item">Gallery</span>
        </a>
        <span class="tooltip">Gallery</span>
      </li>
      <li>
        <a href="{% url 'form' %}" class="active">
          <i class='bx bx-pencil'></i>
          <span class="nav-item">Form</span>
        </a>
        <span class="tooltip">Form</span>
      </li>
      <li>
        <a href="#">
          <i class="bx bx-cog"></i>
          <span class="nav-item">Settings</span>
        </a>
        <span class="tooltip">Settings</span>
      </li>
      <li>
        <a href="#">
          <i class="bx bx-log-out"></i>
          <span class="nav-item">Logout</span>
        </a>
        <span class="tooltip">Logout</span>
      </li>
    </ul>
  </div>
  <!-- Sidebar Menu End -->

  <!-- Main Content -->
  <div class="main-content">
    <h1>Formular</h1>
    <form onsubmit="return validateForm()">
      <label>Salutation
        <select name="salutation">
          <option>--None--</option>
          <option>Mr.</option>
          <option>Ms.</option>
          <option>Mrs.</option>
          <option>Dr.</option>
          <option>Prof.</option>
        </select>
      </label>

      <label>First name:
        <input name="firstName" />
      </label>

      <label>Last name:
        <input name="lastName" />
      </label>

      <label>Gender:</label>
      <label><input type="radio" name="gender" value="male" />Male</label>
      <label><input type="radio" name="gender" value="female" />Female</label>

      <label>Email:
        <input type="email" name="email" />
      </label>

      <label>Date of Birth:
        <input type="date" name="birthDate">
      </label>

      <label>Address:
        <textarea name="address" rows="3"></textarea>
      </label>

      <label>Interests:</label>
      <label><input type="checkbox" /> Sports</label>
      <label><input type="checkbox" /> Music</label>
      <label><input type="checkbox" /> Movies</label>

      <label>Profile Picture:
        <input type="file" name="profilePic" accept="image/*">
      </label>

      <label>Upload CV (PDF only):
        <input type="file" name="cv" accept="application/pdf">
      </label>

      <label>Preferred Contact Methods:</label>
      <label><input type="checkbox" name="contactMethods" /> Email</label>
      <label><input type="checkbox" name="contactMethods" /> SMS</label>

      <button type="submit">Submit</button>
    </form>

    
</body>
</html>
